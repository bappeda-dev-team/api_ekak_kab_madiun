basePath: /
definitions:
  bidangurusanresponse.BidangUrusanResponse:
    properties:
      id:
        type: string
      kode_bidang_urusan:
        type: string
      nama_bidang_urusan:
        type: string
      tahun:
        type: string
    type: object
  sasaranopd.IndikatorResponse:
    properties:
      definisi_operasional:
        type: string
      id:
        type: string
      indikator:
        type: string
      jenis:
        type: string
      kode_indikator:
        type: string
      rumus_perhitungan:
        type: string
      sumber_data:
        type: string
      target:
        items:
          $ref: '#/definitions/sasaranopd.TargetResponse'
        type: array
    type: object
  sasaranopd.PelaksanaOpdResponse:
    properties:
      id:
        type: string
      nama_pegawai:
        type: string
      nip:
        type: string
