  sasaranopd.SasaranOpdDetailResponse:
    properties:
      id:
        type: string
      id_tujuan_opd:
        type: integer
      indikator:
        items:
          $ref: '#/definitions/sasaranopd.IndikatorResponse'
        type: array
      jenis_periode:
        type: string
      nama_sasaran_opd:
        type: string
      nama_tujuan_opd:
        type: string
      tahun_akhir:
        type: string
      tahun_awal:
        type: string
    type: object
  sasaranopd.SasaranOpdResponse:
    properties:
      id_pohon:
        type: integer
      is_hide:
        type: boolean
      jenis_pohon:
        type: string
      kode_opd:
        type: string
      level_pohon:
        type: integer
      nama_opd:
        type: string
      nama_pohon:
        type: string
      pelaksana:
        items:
          $ref: '#/definitions/sasaranopd.PelaksanaOpdResponse'
        type: array
      sasaran_opd:
        items:
          $ref: '#/definitions/sasaranopd.SasaranOpdDetailResponse'
        type: array
      tahun_pohon:
        type: string
    type: object
  sasaranopd.TargetResponse:
    properties:
      id:
        type: string
      satuan:
        type: string
      tahun:
        type: string
      target:
        type: string
    type: object
  sasaranpemda.IndikatorPenetapanDualResponse:
    properties:
      definisi_operasional:
        type: string
      id:
        type: integer
      indikator:
        type: string
      kode_indikator:
        type: string
      rumus_perhitungan:
        type: string
      sumber_data:
        type: string
      target_penetapan:
        items:
          $ref: '#/definitions/sasaranpemda.TargetResponse'
        type: array
      target_rankhir:
        items:
          $ref: '#/definitions/sasaranpemda.TargetResponse'
        type: array
    type: object
  sasaranpemda.PeriodeResponse:
    properties:
      id:
        type: integer
      jenis_periode:
        type: string
      tahun_akhir:
        type: string
      tahun_awal:
        type: string
    type: object
  sasaranpemda.SasaranPemdaPenetapanDualResponse:
    properties:
      id:
        type: integer
      indikator:
        items:
          $ref: '#/definitions/sasaranpemda.IndikatorPenetapanDualResponse'
        type: array
      periode:
        $ref: '#/definitions/sasaranpemda.PeriodeResponse'
      sasaran_pemda:
        type: string
    type: object
  sasaranpemda.TargetDisplay:
    type: object
  sasaranpemda.TargetResponse:
    properties:
      id:
        description: id DB auto-increment (0 = slot kosong)
        type: integer
      jenis:
        type: string
      satuan:
        type: string
      tahun:
        type: string
      target:
        $ref: '#/definitions/sasaranpemda.TargetDisplay'
    type: object
  tujuanopd.IndikatorResponse:
    properties:
      definisi_operasional:
        type: string
      id:
        type: string
      id_tujuan_opd:
        type: integer
      indikator:
        type: string
      jenis:
        type: string
      kode_indikator:
        type: string
      rumus_perhitungan:
        type: string
      sumber_data:
        type: string
      sumber_jenis:
        type: string
      target:
        description: Diisi untuk renstra / ranwal (single-slot)
        items:
          $ref: '#/definitions/tujuanopd.TargetResponse'
        type: array
      target_penetapan:
        description: 'Dual-slot penetapan: target_rankhir + target_penetapan'
        items:
          $ref: '#/definitions/tujuanopd.TargetResponse'
        type: array
      target_rankhir:
        items:
          $ref: '#/definitions/tujuanopd.TargetResponse'
        type: array
      target_ranwal:
        description: 'Dual-slot rankhir: target_ranwal + target_rankhir'
        items:
          $ref: '#/definitions/tujuanopd.TargetResponse'
        type: array
      target_renstra:
        description: Legacy compare field
        items:
          $ref: '#/definitions/tujuanopd.TargetResponse'
        type: array
    type: object
  tujuanopd.TargetResponse:
    properties:
      id:
        type: string
      indikator_id:
        type: string
      jenis:
        type: string
      satuan:
        type: string
      tahun:
        type: string
      target:
        type: string
    type: object
  tujuanopd.TujuanOpdPenetapanResponse:
    properties:
      is_lock:
        type: boolean
      kode_bidang_urusan:
        type: string
      kode_opd:
        type: string
      kode_urusan:
        type: string
      nama_bidang_urusan:
        type: string
      nama_opd:
        type: string
      tujuan_opd:
        items:
          $ref: '#/definitions/tujuanopd.TujuanOpdResponse'
        type: array
      urusan:
        type: string
    type: object
  tujuanopd.TujuanOpdResponse:
    properties:
      id_tujuan_opd:
        type: integer
      indikator:
        items:
          $ref: '#/definitions/tujuanopd.IndikatorResponse'
        type: array
      jenis_penetapan:
        description: IsLocked         bool                `json:"is_locked"`
        type: string
      jenis_periode:
        type: string
      kode_bidang_urusan:
        type: string
      kode_opd:
        type: string
      nama_bidang_urusan:
        type: string
      nama_opd:
        type: string
      rumus_perhitungan:
        type: string
      sumber_data:
        type: string
      tahun_akhir:
        type: string
      tahun_awal:
        type: string
      tujuan:
        type: string
    type: object
  tujuanopd.TujuanOpdwithBidangUrusanResponse:
    properties:
      kode_bidang_urusan:
        type: string
      kode_opd:
        type: string
      kode_urusan:
        type: string
      nama_bidang_urusan:
        type: string
      nama_opd:
        type: string
      tujuan_opd:
        description: IsLock           bool                `json:"is_lock"`
        items:
          $ref: '#/definitions/tujuanopd.TujuanOpdResponse'
        type: array
      urusan:
        type: string
    type: object
  tujuanpemda.IndikatorPenetapanDualResponse:
    properties:
      definisi_operasional:
        type: string
      id:
        type: integer
      indikator:
        type: string
      jenis:
        type: string
      kode_indikator:
        type: string
      rumus_perhitungan:
        type: string
      sumber_data:
        type: string
      target_penetapan:
        items:
          $ref: '#/definitions/tujuanpemda.TargetDualResponse'
        type: array
      target_rankhir:
        items:
          $ref: '#/definitions/tujuanpemda.TargetDualResponse'
        type: array
    type: object
  tujuanpemda.PeriodeResponse:
    properties:
      jenis_periode:
        type: string
      tahun_akhir:
        type: string
      tahun_awal:
        type: string
    type: object
  tujuanpemda.TargetDisplay:
    type: object
  tujuanpemda.TargetDualResponse:
    properties:
      id:
        type: integer
      satuan:
        type: string
      tahun:
        type: string
      target:
        $ref: '#/definitions/tujuanpemda.TargetDisplay'
    type: object
  tujuanpemda.TujuanPemdaPenetapanDualResponse:
    properties:
      id:
        type: integer
      id_misi:
        type: integer
      id_visi:
        type: integer
      indikator:
        items:
          $ref: '#/definitions/tujuanpemda.IndikatorPenetapanDualResponse'
        type: array
      is_hide:
        type: boolean
      is_lock:
        type: boolean
      misi:
        type: string
      nama_tematik:
        type: string
      periode:
        $ref: '#/definitions/tujuanpemda.PeriodeResponse'
      tematik_id:
        type: integer
      tujuan_pemda:
        type: string
      visi:
        type: string
    type: object
  web.ActionButton:
    properties:
      jenis_usulan:
        type: string
      method:
        type: string
      name:
        type: string
      url:
        type: string
    type: object
  web.WebRencanaKinerjaResponse:
    properties:
      code:
        type: integer
      rencana_kinerja: {}
      rencana_kinerja_action:
        items:
          $ref: '#/definitions/web.ActionButton'
        type: array
      status:
        type: string
    type: object
  web.WebResponse:
    properties:
      code:
        type: integer
      data: {}
      error:
        type: string
      status:
        type: string
    type: object
info:
  contact:
    name: Tim Pengembang
  description: API Backend Kertas Kerja Kabupaten Madiun
  termsOfService: http://swagger.io/terms/
  title: EKAK Kabupaten Madiun API
  version: "1.0"
paths:
  /bidang_urusan/findall/{kode_opd}:
    get:
      consumes:
      - application/json
      description: Mendapatkan daftar bidang urusan berdasarkan kode OPD.
      parameters:
      - description: Kode OPD
        example: '"1.01.1.01.0.00.01.0000"'
        in: path
        name: kode_opd
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/web.WebResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/bidangurusanresponse.BidangUrusanResponse'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/web.WebResponse'
      security:
      - None: []
      summary: Bidang Urusan by Kode OPD
      tags:
      - Bidang Urusan
      - IntegrasiKabMadiun
  /get_rencana_kinerja/pegawai/{pegawai_id}:
    get:
      consumes:
      - application/json
      description: 'Mendapatkan daftar rencana kinerja pegawai berdasarkan ID pegawai.
        Filter opsional: kode_opd dan tahun (query).'
      parameters:
      - description: ID Pegawai
        in: path
        name: pegawai_id
        required: true
        type: string
      - description: Kode OPD
        in: query
        name: kode_opd
        type: string
      - description: Tahun
        in: query
        name: tahun
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/web.WebRencanaKinerjaResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/web.WebRencanaKinerjaResponse'
      security:
      - None: []
      summary: Sasaran Kinerja Pegawai
      tags:
      - Rencana Kinerja
      - IntegrasiKabMadiun
  /sasaran_opd/penetapan/{kode_opd}/{tahun}:
    get:
      consumes:
      - application/json
      description: Mendapatkan data sasaran opd penetapan berdasarkan kode OPD dan
        tahun.
      parameters:
      - description: Kode OPD
        example: '"1.01.1.01.0.00.01.0000"'
        in: path
        name: kode_opd
        required: true
        type: string
      - description: Tahun
        example: '"2025"'
        in: path
        name: tahun
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/web.WebResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/sasaranopd.SasaranOpdResponse'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/web.WebResponse'
      security:
      - None: []
      summary: Sasaran Opd Penetapan
      tags:
      - Sasaran Opd Renja Penetapan
      - IntegrasiKabMadiun
  /sasaran_opd/renstra/{kode_opd}/{tahun_awal}/{tahun_akhir}/{jenis_periode}:
    get:
      consumes:
      - application/json
      description: Mendapatkan data sasaran opd renstra berdasarkan kode OPD dan tahun.
      parameters:
      - description: Kode OPD
        example: '"1.01.1.01.0.00.01.0000"'
        in: path
        name: kode_opd
        required: true
        type: string
      - description: Tahun Awal
        example: '"2025"'
        in: path
        name: tahun_awal
        required: true
        type: string
      - description: Tahun Akhir
        example: '"2026"'
        in: path
        name: tahun_akhir
        required: true
        type: string
      - description: Jenis Periode
        example: '"RPJMD"'
        in: path
        name: jenis_periode
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/web.WebResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/sasaranopd.SasaranOpdResponse'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/web.WebResponse'
      security:
      - None: []
      summary: Sasaran Opd Renstra
      tags:
      - Sasaran Opd Renstra
      - IntegrasiKabMadiun
  /sasaran_pemda/v2/penetapan/{tahun}:
    get:
      consumes:
      - application/json
      description: Mengambil daftar sasaran pemda penetapan (dual target) dengan filter
        tematik berdasarkan tahun.
      parameters:
      - description: Tahun yang akan diambil
        example: '"2025"'
        in: path
        name: tahun
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/web.WebResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/sasaranpemda.SasaranPemdaPenetapanDualResponse'
                  type: array
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/web.WebResponse'
      security:
      - None: []
      summary: Sasaran Pemda Penetapan V2
      tags:
      - Sasaran Pemda Penetapan
      - IntegrasiKabMadiun
  /tujuan_opd/penetapan/{kode_opd}/{tahun}:
    get:
      consumes:
      - application/json
      description: Mendapatkan data tujuan opd penetapan berdasarkan kode OPD dan
        tahun.
      parameters:
      - description: Kode OPD
        example: '"1.01.1.01.0.00.01.0000"'
        in: path
        name: kode_opd
        required: true
        type: string
      - description: Tahun
        example: '"2025"'
        in: path
        name: tahun
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/web.WebResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/tujuanopd.TujuanOpdPenetapanResponse'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/web.WebResponse'
      security:
      - None: []
      summary: Tujuan Opd Renja Penetapan
      tags:
      - Tujuan Opd Renja Penetapan
      - IntegrasiKabMadiun
  /tujuan_opd/renstra/{kode_opd}/{tahun_awal}/{tahun_akhir}:
    get:
      consumes:
      - application/json
      description: Mendapatkan data tujuan opd renstra berdasarkan kode OPD dan tahun.
      parameters:
      - description: Kode OPD
        example: '"1.01.1.01.0.00.01.0000"'
        in: path
        name: kode_opd
        required: true
        type: string
      - description: Tahun Awal
        example: '"2025"'
        in: path
        name: tahun_awal
        required: true
        type: string
      - description: Tahun Akhir
        example: '"2030"'
        in: path
        name: tahun_akhir
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/web.WebResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/tujuanopd.TujuanOpdwithBidangUrusanResponse'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/web.WebResponse'
      security:
      - None: []
      summary: Tujuan Opd Renstra
      tags:
      - Tujuan Opd Renstra
      - IntegrasiKabMadiun
  /tujuan_pemda/penetapan/{tahun}:
    get:
      consumes:
      - application/json
      description: 'Menampilkan 2 target per indikator: ranwal dan rankhir. Tanpa
        fallback antar jenis.'
      parameters:
      - description: Tahun
        example: '"2025"'
        in: path
        name: tahun
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/web.WebResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/tujuanpemda.TujuanPemdaPenetapanDualResponse'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/web.WebResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/web.WebResponse'
      security:
      - None: []
      summary: Tujuan Pemda Penetapan (Dual Target)
      tags:
      - Tujuan Pemda
      - IntegrasiKabMadiun
schemes:
- http
- https
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
